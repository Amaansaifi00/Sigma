<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/action">
        <label for="username">Username:</label>
        <input type="text" placeholder="Enter name" id="username" name="username"><br>
        <label for="password">Password:</label>
        <input type="password" placeholder="password" id="password" name="password"><br>
        <button type="submit">Submit</button>
        <input type="checkbox" id="age" name="age">
        <label for="age">I am over 18</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>  
        <select name="profession" id="profession">
            <option value="student">student</option>
            <option value="dev">Developer</option>
        </select>
        <label for="feedback">Please provide your valuable feedback:</label> 
        <textarea name="feedback" id="feedback" rows="4" cols="50"></textarea>

    </form>
    
</body>
</html>
