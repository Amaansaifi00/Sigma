<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Feedback form</h1>
    <form action="/action">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <div>
            <label for="feedback">Feedback:</label><br>
            <textarea name="feedback" id="feedback" cols="30" rows="4" placeholder="Enter your feedback"></textarea>
        </div>
        <div>
            <label for="rating">Rate us out of 5:</label><br>
            <input type="radio" id="rating1" name="rating" value="1">
            <label for="rating1">1</label><br>
            <input type="radio" id="rating2" name="rating" value="2">
            <label for="rating2">2</label><br>
            <input type="radio" id="rating3" name="rating" value="3">
            <label for="rating3">3</label><br>
            <input type="radio" id="rating4" name="rating" value="4">
            <label for="rating4">4</label><br>
            <input type="radio" id="rating5" name="rating" value="5">
            <label for="rating5">5</label>
        </div>
        <div>
            <input type="submit" value="Submit">
        </div> 
</body>
</html>
